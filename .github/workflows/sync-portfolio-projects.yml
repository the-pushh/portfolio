name: Sync portfolio projects

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:sync:github-projects
        env:
          DATABASE_URL: ${{ secrets.PORTFOLIO_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PORTFOLIO_DATABASE_URL }}
